server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control "no-store" always;
  }
  location = /key {
    proxy_pass http://headscale:8080/key$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18080;
    proxy_set_header X-Forwarded-Proto http;
    proxy_buffering off;
  }
  # Route the streaming Noise upgrade explicitly. The control URL must be the app origin root: a
  # path-prefixed control URL is preserved inside the encrypted HTTP/2 request and Headscale then
  # correctly rejects `/prefix/machine/register` as unknown.
  location /ts2021 {
    proxy_pass http://headscale:8080;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }
}
