server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Resolve the `headscale` service name at REQUEST time via Docker's embedded DNS, not at nginx
  # startup. Startup resolution races the DNS registration of a just-(re)started container and makes
  # nginx exit with "host not found in upstream headscale" (seen on some Docker hosts) → a crash loop.
  # A `resolver` + a variable proxy_pass target defers resolution and keeps nginx resilient.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control "no-store" always;
  }
  location = /key {
    set $hs_upstream headscale;
    proxy_pass http://$hs_upstream:8080/key$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18080;
    proxy_set_header X-Forwarded-Proto http;
    proxy_buffering off;
  }
  # Route the streaming Noise upgrade explicitly. The control URL must be the app origin root: a
  # path-prefixed control URL is preserved inside the encrypted HTTP/2 request and Headscale then
  # correctly rejects `/prefix/machine/register` as unknown.
  location /ts2021 {
    set $hs_upstream headscale;
    proxy_pass http://$hs_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Host localhost:18080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }
}
