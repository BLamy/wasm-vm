<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wasm-vm — tty0 damage rectangles</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --bg: #090b0f;
        --panel: #10141b;
        --line: #242b36;
        --text: #eef2f7;
        --muted: #9aa6b2;
        --green: #2ea043;
        --red: #f85149;
        --cyan: #53d4ff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
      header {
        display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
        padding: 16px 20px; border-bottom: 1px solid var(--line); background: #0d1015;
      }
      h1 { margin: 0; font-size: 16px; font-weight: 650; }
      h1 a { color: inherit; text-decoration: none; }
      .status, code, pre, .meta { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .status { color: var(--cyan); text-align: right; }
      main {
        display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, .8fr);
        gap: 16px; max-width: 1500px; margin: 0 auto; padding: 20px;
      }
      section { min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
      .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      h2 { margin: 0; font-size: 13px; text-transform: uppercase; }
      .meta { color: var(--muted); }
      .canvas-wrap { display: grid; place-items: center; min-height: min(70vh, 760px); padding: 18px; background: #000; }
      #tty0-damage-canvas {
        display: block; width: min(100%, 1280px); height: auto; aspect-ratio: 1280 / 800;
        background: #000; image-rendering: pixelated; box-shadow: 0 0 0 1px #1c2430, 0 12px 36px rgba(0, 0, 0, .42);
      }
      .serial-wrap { padding: 14px; }
      #serial-log { margin: 0; min-height: 520px; max-height: 70vh; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: #cdd6f4; }
      #proof { margin: 0; padding: 10px 14px 14px; border-top: 1px solid var(--line); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow: auto; }
      [data-state="ready"] { color: var(--green); }
      [data-state="error"] { color: var(--red); }
      @media (max-width: 900px) {
        main { grid-template-columns: 1fr; padding: 12px; }
        .canvas-wrap { min-height: 0; }
        #serial-log { min-height: 280px; max-height: 45vh; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="./index.html">wasm-vm</a> — tty0 damage rectangles</h1>
      <div id="tty0-damage-status" class="status" role="status" aria-live="polite" data-state="booting">starting cold boot…</div>
    </header>
    <main>
      <section aria-labelledby="display-title">
        <div class="section-head">
          <h2 id="display-title">Guest fbcon surface</h2>
          <span id="display-backend" class="meta">selecting backend…</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="tty0-damage-canvas" width="1280" height="800" aria-label="RISC-V Linux tty0 framebuffer"></canvas>
        </div>
        <pre id="proof" aria-live="polite">waiting for the framebuffer and tty0 command…</pre>
      </section>
      <section aria-labelledby="serial-title">
        <div class="section-head">
          <h2 id="serial-title">Serial command boundary</h2>
          <span id="serial-state" class="meta">cold boot</span>
        </div>
        <div class="serial-wrap">
          <pre id="serial-log" aria-label="Guest serial log"></pre>
        </div>
      </section>
    </main>
    <script type="module" src="./tty0-damage.js"></script>
  </body>
</html>
