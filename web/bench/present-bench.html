<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wasm-vm presentation path benchmark</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { margin: 2rem; max-width: 70rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .note { opacity: .8; }
  </style>
</head>
<body>
  <h1>Presentation path benchmark</h1>
  <p class="note">Canvas2D and WebGL2 use the same full-resource BGRA frame source and damage rectangles.</p>
  <button id="run" type="button">Run benchmark</button>
  <pre id="results">{"status":"idle"}</pre>
  <script type="module">
    import { Canvas2DBackend } from "/src/sink/canvas2d.js";
    import { WebGL2Backend } from "/src/sink/webgl.js";

    const DEFAULT_WIDTHS = Object.freeze([1280, 2560]);
    const DEFAULT_HEIGHTS = Object.freeze([800, 1600]);
    const DAMAGE_SIZE = 64;
    const COPIES_PER_FRAME = 2;
    const resultsElement = document.getElementById("results");

    function round3(value) {
      return Math.round(value * 1000) / 1000;
    }

    function browserName() {
      const brands = navigator.userAgentData?.brands || [];
      const chromiumBrand = brands.find(({ brand }) => /Chromium|Chrome/i.test(brand));
      if (chromiumBrand) return "Chromium";
      if (/Firefox/i.test(navigator.userAgent)) return "Firefox";
      if (/Safari/i.test(navigator.userAgent) && !/Chrome/i.test(navigator.userAgent)) return "WebKit";
      return "Unknown";
    }

    function browserInfo() {
      return {
        name: browserName(),
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        devicePixelRatio: window.devicePixelRatio,
        visibilityState: document.visibilityState,
        hardwareConcurrency: navigator.hardwareConcurrency ?? null,
      };
    }

    function deterministicFrame(width, height) {
      const frame = new Uint32Array(width * height);
      for (let index = 0; index < frame.length; index += 1) {
        const red = index & 0xff;
        const green = (index >>> 8) & 0xff;
        const blue = (index >>> 16) & 0xff;
        frame[index] = (0xff000000 | (red << 16) | (green << 8) | blue) >>> 0;
      }
      return frame;
    }

    function mutateDamage(frame, width, rect, iteration) {
      const seed = iteration & 0xff;
      for (let row = 0; row < rect.height; row += 1) {
        const start = (rect.y + row) * width + rect.x;
        for (let column = 0; column < rect.width; column += 1) {
          const blue = (column + seed) & 0xff;
          const green = (row + (seed * 3)) & 0xff;
          const red = (row + column + (seed * 5)) & 0xff;
          frame[start + column] = (0xff000000 | (red << 16) | (green << 8) | blue) >>> 0;
        }
      }
    }

    function percentile(sorted, fraction) {
      const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * fraction) - 1));
      return sorted[index];
    }

    function summarize(samples) {
      const sorted = [...samples].sort((left, right) => left - right);
      const total = samples.reduce((sum, value) => sum + value, 0);
      const mean = total / samples.length;
      const variance = samples.reduce((sum, value) => sum + ((value - mean) ** 2), 0) / samples.length;
      return {
        minMs: round3(sorted[0]),
        maxMs: round3(sorted[sorted.length - 1]),
        meanMs: round3(mean),
        p50Ms: round3(percentile(sorted, 0.5)),
        p95Ms: round3(percentile(sorted, 0.95)),
        stdevMs: round3(Math.sqrt(variance)),
        totalMs: round3(total),
      };
    }

    function makeCanvas(width, height) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.style.position = "fixed";
      canvas.style.left = "-10000px";
      canvas.style.top = "0";
      canvas.style.width = "1px";
      canvas.style.height = "1px";
      canvas.setAttribute("aria-hidden", "true");
      document.body.append(canvas);
      return canvas;
    }

    function makeBackend(backendName, canvas) {
      if (backendName === "canvas2d") return new Canvas2DBackend(canvas);
      if (backendName === "webgl2") return new WebGL2Backend(canvas);
      throw new Error(`unknown presentation backend: ${backendName}`);
    }

    function presentAndFlush(backend, backendName, rect, frame) {
      backend.present(rect, frame);
      // WebGL command submission is normally asynchronous. Finish inside the timed section so
      // the recorded number represents completed upload/draw work, not merely queueing work.
      if (backendName === "webgl2") backend.gl.finish();
    }

    function chooseDecision(cells, width, height, workload) {
      const candidates = cells
        .filter((cell) => cell.width === width && cell.height === height && cell.workload === workload)
        .sort((left, right) => (left.p50Ms - right.p50Ms) || (left.meanMs - right.meanMs));
      if (candidates.length !== 2 || candidates.some((cell) => cell.status !== "ok")) {
        throw new Error(`cannot choose a backend for ${width}x${height} ${workload}`);
      }
      const winner = candidates[0];
      const runnerUp = candidates[1];
      const marginMs = runnerUp.p50Ms - winner.p50Ms;
      return {
        metric: "p50Ms",
        tieBreaker: "meanMs",
        resolution: { width, height },
        workload,
        defaultBackend: winner.backend,
        fallbackOrder: [winner.backend, runnerUp.backend],
        fasterMs: winner.p50Ms,
        slowerMs: runnerUp.p50Ms,
        marginMs: round3(marginMs),
        marginPercent: round3(runnerUp.p50Ms > 0 ? (marginMs / runnerUp.p50Ms) * 100 : 0),
        variance: {
          defaultStdevMs: winner.stdevMs,
          fallbackStdevMs: runnerUp.stdevMs,
        },
        fallbackConditions: [
          "Use the fallback when the default context is unavailable or creation fails.",
          "A context-loss or upload failure must dispose the failed backend before fallback.",
        ],
      };
    }

    async function runCell({ width, height, backendName, workload, warmups, samples }) {
      const fullRect = { x: 0, y: 0, width, height };
      const damageRect = { x: 1, y: 1, width: DAMAGE_SIZE, height: DAMAGE_SIZE };
      const rect = workload === "full-frame" ? fullRect : damageRect;
      const frame = deterministicFrame(width, height);
      const canvas = makeCanvas(width, height);
      let backend;
      try {
        backend = makeBackend(backendName, canvas);
        for (let iteration = 0; iteration < warmups; iteration += 1) {
          mutateDamage(frame, width, damageRect, iteration);
          presentAndFlush(backend, backendName, rect, frame);
        }
        const timings = [];
        for (let iteration = 0; iteration < samples; iteration += 1) {
          mutateDamage(frame, width, damageRect, warmups + iteration);
          const start = performance.now();
          presentAndFlush(backend, backendName, rect, frame);
          timings.push(performance.now() - start);
        }
        return {
          id: `${width}x${height}-${backendName}-${workload}`,
          width,
          height,
          browser: browserName(),
          devicePixelRatio: window.devicePixelRatio,
          backend: backendName,
          workload,
          rect,
          warmupFrames: warmups,
          sampleCount: timings.length,
          copiesPerFrame: COPIES_PER_FRAME,
          copyModel: backendName === "canvas2d"
            ? "source BGRA Uint32Array -> private RGBA staging -> ImageData; putImageData transfers the damage to Canvas2D"
            : "source BGRA Uint32Array -> private Uint8Array staging -> texSubImage2D; fragment shader performs .bgra swizzle",
          timer: "performance.now around present and WebGL finish",
          status: "ok",
          ...summarize(timings),
        };
      } finally {
        backend?.dispose?.();
        canvas.remove();
      }
    }

    window.runPresentBench = async function runPresentBench({
      samples = 300,
      warmups = 30,
      widths = DEFAULT_WIDTHS,
      heights = DEFAULT_HEIGHTS,
      profile = "baseline",
    } = {}) {
      if (!Number.isSafeInteger(samples) || samples < 300) throw new RangeError("samples must be at least 300");
      if (!Number.isSafeInteger(warmups) || warmups < 0) throw new RangeError("warmups must be non-negative");
      if (!Array.isArray(widths) || !Array.isArray(heights) || widths.length !== heights.length) {
        throw new TypeError("widths and heights must be equal-length arrays");
      }
      const startedAt = performance.now();
      const cells = [];
      for (let index = 0; index < widths.length; index += 1) {
        const width = widths[index];
        const height = heights[index];
        for (const backend of ["canvas2d", "webgl2"]) {
          for (const workload of ["full-frame", "damage-64x64"]) {
            cells.push(await runCell({ width, height, backendName: backend, workload, warmups, samples }));
          }
        }
      }
      const result = {
        schema: 1,
        kind: "present-path-benchmark-v1",
        generatedAt: new Date().toISOString(),
        profile,
        browser: browserInfo(),
        policy: {
          warmupFrames: warmups,
          sampleFrames: samples,
          timer: "performance.now around present and WebGL finish",
          damageRect: { x: 1, y: 1, width: DAMAGE_SIZE, height: DAMAGE_SIZE },
          copiesPerFrame: COPIES_PER_FRAME,
          source: "one deterministic full resource-sized BGRA Uint32Array per cell",
        },
        cells,
        decision: chooseDecision(cells, widths[0], heights[0], "damage-64x64"),
        elapsedMs: round3(performance.now() - startedAt),
      };
      window.__presentBenchLast = result;
      resultsElement.textContent = JSON.stringify(result, null, 2);
      return result;
    };

    document.getElementById("run").addEventListener("click", async () => {
      resultsElement.textContent = JSON.stringify({ status: "running" }, null, 2);
      try {
        const profile = new URLSearchParams(window.location.search).get("profile") || "manual";
        await window.runPresentBench({ profile });
      } catch (error) {
        resultsElement.textContent = JSON.stringify({ status: "error", error: String(error) }, null, 2);
        throw error;
      }
    });
    window.presentBenchReady = true;
  </script>
</body>
</html>
