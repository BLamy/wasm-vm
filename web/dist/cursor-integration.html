<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wasm-vm — cursor plane integration proof</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #090b0f;
        color: #eef2f7;
      }
      body { margin: 0; min-height: 100vh; }
      header { padding: 16px 20px; border-bottom: 1px solid #242b36; background: #0d1015; }
      h1 { margin: 0; font-size: 16px; font-weight: 650; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px; }
      .status, pre { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .status { margin-top: 8px; color: #53d4ff; }
      .status[data-state="ready"] { color: #2ea043; }
      .status[data-state="error"] { color: #f85149; }
      #surface-host {
        position: relative;
        width: min(100%, 768px);
        aspect-ratio: 16 / 10;
        margin-top: 16px;
        overflow: hidden;
        background: #000;
      }
      #display {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #proof { max-height: 36rem; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <header>
      <h1>wasm-vm — cursor plane integration proof</h1>
      <div id="status" class="status" role="status" aria-live="polite" data-state="booting">loading proof route…</div>
    </header>
    <main>
      <div id="surface-host" aria-label="cursor integration surface">
        <canvas id="display" width="128" height="80"></canvas>
      </div>
      <pre id="proof">waiting for the verifier…</pre>
    </main>
    <script type="module" src="./cursor-integration.js"></script>
  </body>
</html>
