# E5-T34b shared desktop: Replay Chrome 108 (left) and a foot terminal with Node 26 (right),
# tiled side by side by sway itself, so both are visible without a shell/panel client process.
xwayland disable
font pango:DejaVu Sans 10
default_border normal 2
focus_follows_mouse no
client.focused #3b4b61 #2d3a4c #e5e7eb #8ee0a1 #3b4b61
input type:keyboard xkb_layout us
for_window [app_id="(?i)chrom"] move left, resize set width 62 ppt
exec /usr/local/bin/replay-chromium
exec foot --app-id=replay-terminal --title="Replay Node 26 terminal"
