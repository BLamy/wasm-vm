[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/slirp",
    "crates/file-agent-storage",
    "crates/file-agent",
    "crates/wvseccomp",
    "crates/wasm",
    "crates/wasm-emit",
    "crates/cli",
    "tools/fuzz",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.96.0"
repository = "https://github.com/BLamy/wasm-vm"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wasm-vm-core = { path = "crates/core", default-features = false }
wasm-bindgen = "0.2"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
console_log = "1"
console_error_panic_hook = "0.1"
memmap2 = "0.9"

# E4-T02 flamegraphs: a profiling build that is byte-for-byte the release optimisation pipeline
# (opt-level 3, same codegen-units / lto) but keeps full DWARF debuginfo so `samply` can attribute
# host samples to readable Rust frame names. Additive — it does NOT mutate `[profile.release]`, so
# the shipped release binary and every existing bench number are unchanged. Build the emulator for
# profiling with:  `cargo build --profile profiling -p wasm-vm-cli`  (binary: target/profiling/wasm-vm).
# See docs/perf/flamegraphs.md.
[profile.profiling]
inherits = "release"
debug = true          # full DWARF line tables + symbols; no effect on codegen/optimisation
strip = false         # never strip — stripping is what produces anonymous [unknown] frames
