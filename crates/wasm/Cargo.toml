[package]
name = "wasm-vm-wasm"
description = "The wasm-bindgen boundary: everything browser-specific, nothing emulator-specific"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-vm-core = { workspace = true, features = ["trace"] }
wasm-vm-storage = { path = "../storage" }
# E4-T29 Phase 2: the browser (WebAssembly.compile/instantiate) JIT executor translates hot blocks
# with the SAME frozen ABI the native wasmtime path uses.
wasm-vm-jit-translate = { path = "../jit-translate" }
# E3-net: the browser slirp local stack (DHCP/ARP/ICMP). default-features off → no tokio in the browser.
wasm-vm-slirp = { path = "../slirp", default-features = false }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# virtio-rng entropy: the js backend calls crypto.getRandomValues (main thread + workers).
getrandom = { version = "0.2", features = ["js"] }
log = { workspace = true }
console_log = { workspace = true }
console_error_panic_hook = { workspace = true }
sha2 = { version = "0.10", default-features = false }

# The `fetch` surface for the E3-T02 lazy chunk loader (browser only; gated behind wasm32 in code).
[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "WorkerGlobalScope",
    "Performance",
    "Request",
    "RequestInit",
    "RequestMode",
    "Headers",
    "Response",
    "AbortController",
    "AbortSignal",
    # E3-T05 IndexedDB durable overlay backend.
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "IdbRequest",
    "IdbVersionChangeEvent",
    "DomException",
    "Event",
    "EventTarget",
    # E3-net browser TCP transport.
    "WebSocket",
    "BinaryType",
    "MessageEvent",
  "Worker",
  "WorkerOptions",
  "WorkerType",
    "ErrorEvent",
]

[features]
# Forwards the quarantined E0-T19 CSR stub so the wasm riscv-tests harness can run the
# p-env binaries: `wasm-pack test --node crates/wasm --features zicsr-stub`. Off by default.
zicsr-stub = ["wasm-vm-core/zicsr-stub"]

[dev-dependencies]
wasm-bindgen-test = "0.3"

# E4-T02 flamegraphs: `wasm-pack build --profiling` runs `wasm-opt`, whose DEFAULT strips the
# custom `name` section — so a plain `--profiling` build shows anonymous `wasm-function[N]` frames
# in Chrome/Firefox despite the "profiling" label. Passing `-g` to wasm-opt makes it PRESERVE the
# name section through optimisation, so browser profiles show demangled Rust frames. Verify after a
# build with:  `wasm-objdump -h pkg/wasm_vm_wasm_bg.wasm | grep name`  (must list a "name" Custom
# section). See docs/perf/flamegraphs.md.
[package.metadata.wasm-pack.profile.profiling]
wasm-opt = ['-O', '-g']
