# poor-mans-ci — deploy the PRE-BUILT browser demo to GitHub Pages with NO CI-side build.
#
# Why "poor man's": the expensive wasm/npm build used to run in CI on every push/PR. Now it runs ONCE,
# LOCALLY, in the pre-commit hook (tools/git-hooks/pre-commit → tools/build-web-dist.sh), which commits
# the deployable web/dist. This workflow only *publishes* that committed dist, so a deploy costs a
# checkout + a file copy — no cargo, no wasm-pack, no npm. (Install the hook once: `make hooks`.)
#
#   - push to main        → publish web/dist to  /main/   (the main/prod deployment)
#   - a pull request       → publish web/dist to  /pr-<N>/ (a live preview) + comment the URL
#   - a PR closing         → remove its /pr-<N>/ preview folder
#   - after either         → regenerate the ROOT landing page: a link to /main/ + every open PR preview
#
# Publishes to the `gh-pages` branch (Pages source = "Deploy from a branch: gh-pages /").
name: poor-mans-ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: poor-mans-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The committed dist is the deploy unit. If it's missing, the local pre-commit hook wasn't run —
      # fail loudly with the fix rather than deploying an empty site.
      - name: Verify committed web/dist
        run: |
          if [ ! -f web/dist/index.html ]; then
            echo "::error::web/dist/index.html is missing — the browser demo was not built locally." >&2
            echo "Run 'make hooks' once, then a commit touching web/ rebuilds web/dist; or 'make web-dist' + commit it." >&2
            exit 1
          fi

      # The large boot artifacts (kernel Image + initramfs) are NOT committed into web/dist (they live in
      # releases/, tracked). Copy them in now — a build-free file copy — so the deployed site can boot.
      - name: Stage boot artifacts into web/dist
        run: |
          mkdir -p web/dist/releases/kernel/6.6.63 web/dist/releases/initramfs
          cp releases/kernel/6.6.63/Image web/dist/releases/kernel/6.6.63/Image
          cp releases/initramfs/initramfs.cpio.gz web/dist/releases/initramfs/initramfs.cpio.gz

      - name: Compute deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "url=https://blamy.github.io/wasm-vm/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=main" >> "$GITHUB_OUTPUT"
            echo "url=https://blamy.github.io/wasm-vm/main/" >> "$GITHUB_OUTPUT"
          fi

      # Publish web/dist: a PR under /pr-<N>/, main under /main/. keep_files preserves every OTHER PR's
      # preview folder, /main/, and the root landing page so deploys never clobber siblings.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
          commit_message: "deploy ${{ steps.target.outputs.dir }} @ ${{ github.sha }}"

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.target.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\n🚀 **Live preview** of this PR's browser demo: ${url}\n\n_Deployed from ${context.sha.slice(0,7)} (pre-built web/dist, no CI build). Updates on every push; removed when the PR closes._`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true
      - name: Remove PR preview
        run: |
          dir="pr-${{ github.event.pull_request.number }}"
          if [ -d "$dir" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$dir"
            git commit -m "remove preview for PR #${{ github.event.pull_request.number }}"
            git push
          else
            echo "no preview folder $dir — nothing to clean up"
          fi

  index:
    # Regenerate the ROOT landing page: a prominent link to /main/ (the main deployment) plus every open
    # PR preview, newest (highest #) first. Runs after deploy or cleanup; always() so a skipped sibling
    # doesn't cancel it.
    needs: [deploy, cleanup]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true
      - name: Build landing page (main link + PR previews)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rows=""
          count=0
          while IFS= read -r d; do
            [ -z "$d" ] && continue
            n="${d#pr-}"
            rows="${rows}      <li><a href=\"./${d}/\"><span class=\"num\">PR #${n}</span><span class=\"arrow\">live preview →</span></a></li>\n"
            count=$((count+1))
          done < <(ls -d pr-*/ 2>/dev/null | sed 's#/##' | sort -t- -k2 -n -r)
          [ "$count" -eq 0 ] && rows="      <li class=\"empty\">No open PR previews right now.</li>\n"
          main_link=""
          [ -d main ] && main_link="      <a class=\"main\" href=\"./main/\"><span>▶ Main deployment</span><span class=\"arrow\">open the live app →</span></a>\n"
          cat > index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>wasm-vm — RV64 in the browser</title>
            <style>
              :root { color-scheme: dark; }
              * { box-sizing: border-box; }
              body { margin:0; min-height:100vh; background:#090b0f; color:#eef2f7;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
                display:flex; align-items:flex-start; justify-content:center; padding:48px 20px; }
              main { width:100%; max-width:680px; }
              h1 { font-size:20px; margin:0 0 4px; font-weight:650; }
              .sub { color:#9aa6b2; font:13px ui-monospace, monospace; margin:0 0 24px; }
              a.main { display:flex; justify-content:space-between; align-items:center; gap:16px;
                padding:16px 18px; margin:0 0 22px; text-decoration:none; color:#04121a;
                background:linear-gradient(90deg,#53d4ff,#7ef7c8); border-radius:10px; font-weight:700; }
              a.main .arrow { color:#04303f; font:12px ui-monospace, monospace; font-weight:600; }
              h2 { font-size:13px; color:#9aa6b2; text-transform:uppercase; letter-spacing:.06em; margin:0 0 8px; }
              ul { list-style:none; margin:0; padding:0; border:1px solid #242b36; border-radius:10px; overflow:hidden; }
              li a { display:flex; justify-content:space-between; align-items:center; gap:16px;
                padding:14px 18px; text-decoration:none; color:#eef2f7; border-bottom:1px solid #1a1f28;
                background:#10141b; transition:background 120ms; }
              li:last-child a { border-bottom:0; }
              li a:hover { background:#151c26; }
              .num { font:650 15px ui-monospace, monospace; }
              .arrow { color:#53d4ff; font:12px ui-monospace, monospace; }
              .empty { padding:18px; color:#9aa6b2; text-align:center; font:13px ui-monospace, monospace; }
              footer { margin-top:22px; color:#6b7684; font:12px ui-monospace, monospace; }
              footer a { color:#9aa6b2; }
            </style>
          </head>
          <body>
            <main>
              <h1>wasm-vm — RV64 in the browser</h1>
              <p class="sub">${count} open PR preview(s) · newest first</p>
          $(printf "%b" "$main_link")
              <h2>PR previews</h2>
              <ul>
          $(printf "%b" "$rows")
              </ul>
              <footer>Deployed by the <code>poor-mans-ci</code> workflow (pre-built web/dist, no CI build) · <a href="https://github.com/BLamy/wasm-vm">source</a></footer>
            </main>
          </body>
          </html>
          HTML
          if ! git diff --quiet index.html 2>/dev/null || [ -n "$(git status --porcelain index.html)" ]; then
            git add index.html
            git commit -m "index: landing page (main link + $count preview(s))"
            git push
          else
            echo "index.html unchanged — nothing to push"
          fi
